name: Oportunidades académicas por Telegram

# Parte F del pipeline de oportunidades: corre send_opportunities.py solo,
# 3 veces por semana (lunes/miércoles/viernes), sin intervención manual.
#
# IMPORTANTE: los triggers de "schedule" solo se disparan desde la version
# de este archivo que este en la rama default del repo (normalmente main) -
# hay que mergear esta rama para que el cron quede activo. "workflow_dispatch"
# si se puede correr manualmente desde cualquier rama que tenga este archivo,
# util para probar antes de mergear.
#
# Requiere estos secrets del repo (Settings > Secrets and variables >
# Actions > New repository secret): ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID. Ver README > Envío por Telegram para como conseguirlos.

on:
  schedule:
    # 18:00 UTC = 1:00pm hora Colombia (UTC-5), lunes/miercoles/viernes.
    - cron: "0 18 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  send-opportunities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # data/opportunities_seen.json y data/opportunities_queue.json no
      # estan versionados (son estado, no codigo) y cada corrida del
      # workflow arranca desde un checkout limpio, asi que se persisten
      # entre corridas con un cache: cada corrida guarda una entrada nueva
      # (key con run_id, siempre unica) y restaura la mas reciente que
      # matchee el prefijo restore-keys. La cola (opportunities_queue.json)
      # es la que limita el envio a 1 oportunidad por corrida - sin
      # persistirla entre corridas, cada una perderia lo que quedo
      # pendiente de mandar.
      - name: Restaurar oportunidades ya vistas y la cola de envio
        uses: actions/cache@v4
        with:
          path: |
            data/opportunities_seen.json
            data/opportunities_queue.json
          key: opportunities-seen-${{ github.run_id }}
          restore-keys: |
            opportunities-seen-

      - name: Descubrir, verificar y enviar por Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_opportunities.py
